[package]
name = "kithara-dsp-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
# `kithara-test-utils` is named only by the `#[kithara::test]` expansion.
ignored = ["kithara-test-utils"]

[dependencies]
# The workspace entry drops defaults; `play` builds only with a decoder and an
# HTTP client, so the curve test names the smallest set that compiles.
kithara = { workspace = true, features = ["dsp", "host", "play", "signal", "symphonia", "client-reqwest", "tls-rustls"] }
kithara-test-utils = { workspace = true }

[lints]
workspace = true

[[test]]
name = "dsp"
path = "tests/suite.rs"
