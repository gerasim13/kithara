[package]
name = "kithara-events-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["kithara-test-utils"]

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara-test-utils/client-reqwest"]
client-wreq = ["kithara-test-utils/client-wreq"]
tls-rustls = ["kithara-test-utils/tls-rustls"]
tls-native = ["kithara-test-utils/tls-native"]
flash = ["kithara-test-utils/flash"]
no-block = ["kithara-test-utils/no-block"]

[dependencies]
kithara-events = { workspace = true }
kithara-test-dylib = { workspace = true }

kithara-test-utils = { workspace = true, features = ["hang", "mock"] }

[lints]
workspace = true

[[test]]
name = "events"
path = "tests/suite.rs"
