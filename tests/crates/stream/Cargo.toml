[package]
name = "kithara-stream-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash"]
no-block = ["kithara/no-block"]

[dev-dependencies]
kithara = { workspace = true, default-features = false, features = [
    "usdt",
    "events",
    "platform",
    "storage",
    "stream",
    "tokio-net",
] }
kithara-test-dylib = { workspace = true }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

futures = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[[test]]
name = "stream"
path = "tests/suite.rs"
