[package]
name = "kithara-test-dylib"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
crate-type = ["lib", "dylib"]

[dependencies]
kithara = { workspace = true, features = ["usdt", "mock", "offline", "signal", "tokio-net", "tokio-rt-multi-thread"] }
kithara-integration-tests = { workspace = true }
kithara-test-fixtures = { workspace = true }
kithara-test-utils = { workspace = true, features = ["usdt", "hang", "mock"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
kithara = { workspace = true, features = [
    "usdt",
    "analysis",
    "backend-cpal",
    "encode",
    "fdk-aac",
    "ffmpeg",
    "full",
    "mock",
    "queue",
    "resample-rubato",
    "stretch-signalsmith",
    "symphonia",
    "tokio-net",
    "tokio-rt-multi-thread",
] }

[lints]
workspace = true
