[package]
name = "kithara-hls-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["client-reqwest", "tls-rustls"]
client-reqwest = ["kithara/client-reqwest"]
client-wreq = ["kithara/client-wreq"]
tls-rustls = ["kithara/tls-rustls"]
tls-native = ["kithara/tls-native"]
flash = ["kithara/flash", "kithara-integration-tests/flash"]
no-block = ["kithara/no-block", "kithara-integration-tests/no-block"]

[dependencies]
kithara = { workspace = true, features = ["full", "queue", "probe", "mock", "symphonia", "fdk-aac", "resample-rubato", "stretch-signalsmith"] }
kithara-integration-tests = { workspace = true }
kithara-test-fixtures = { workspace = true }
kithara-test-utils = { workspace = true, features = ["hang", "mock", "probe"] }

aes = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
cbc = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
num-traits = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
ringbuf = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
kithara = { workspace = true, features = ["apple", "client-wreq"] }

[lints]
workspace = true

[[test]]
name = "hls"
path = "tests/light.rs"

[[test]]
name = "hls_heavy"
path = "tests/heavy.rs"

[[test]]
name = "hls_stress"
path = "tests/stress.rs"
