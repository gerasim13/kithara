name: Windows

# Cross-compiling to MSVC answers whether the code builds on Windows. Whether
# it runs there is a question only a Windows machine answers.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Suite on Windows
    # Set only where a Windows runner is attached, so a copy of this repository
    # without one never starts the job. See .github/workflows/ci.yml.
    if: vars.KITHARA_WINDOWS_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_WINDOWS_RUNNER_LABELS) }}
    timeout-minutes: 180

    # The guest carries FFmpeg, and `ffmpeg-sys-next` reads this to find it.
    # Where it sits is a property of the machine, so the machine's variable
    # says it, the way its labels do: unset, the crate falls through to vcpkg
    # and pkg-config, finds neither, and the workspace never compiles.
    env:
      FFMPEG_DIR: ${{ vars.KITHARA_WINDOWS_FFMPEG_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FFmpeg is a shared build, so a test that loads the crate needs its
      # DLLs beside the binary or on the search path.
      - name: Put the FFmpeg libraries on the search path
        shell: powershell
        run: Add-Content $env:GITHUB_PATH "$env:FFMPEG_DIR\bin"

      # The guest carries the toolchain, so this installs nothing either.
      - name: Check the workspace
        run: just check

      - name: Run tests
        run: just test
