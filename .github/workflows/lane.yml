name: Lane

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '1'
  KITHARA_FIXTURE_REFRESH: ''
  KITHARA_CI_CACHE_ROOT: /cache/target/.kithara-ci
  KITHARA_CACHE_TRUST: review
  KITHARA_HANG_PREKILL_SECS: '110'
  RUST_LOG: warn,kithara_play_probe=trace,kithara_warp_probe=trace,kithara_worker_probe=trace,kithara_play::worker::scheduler::observer=debug

jobs:
  authorize:
    name: Lane authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate repository owner and exact diagnostic branch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTOR" == "$OWNER" ]] || { echo "only the repository owner may start a lane"; exit 1; }
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]] || { echo "only the repository owner may re-run a lane"; exit 1; }
          [[ "$EVENT_NAME" == workflow_dispatch ]] || { echo "dispatch the diagnostic explicitly"; exit 1; }
          [[ "$REF" == "refs/heads/codex/ci-signalsmith-6a5b518c-2026-10-06" && "$SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "the diagnostic needs its exact carrier branch and current SHA"; exit 1; }

  signalsmith:
    needs: authorize
    name: Signalsmith real-clock diagnostic
    runs-on: kithara-test-real
    timeout-minutes: 120
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6a5b518ca116dcc4859c57a84d5ade963287b1da
          fetch-depth: 0

      - name: Run the existing workspace harness lane
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          subject_sha=6a5b518ca116dcc4859c57a84d5ade963287b1da
          test "$(git rev-parse HEAD)" = "$subject_sha"
          : "${KITHARA_CI_CACHE_ROOT:?the existing Linux host must provide its mounted CI cache root}"
          test -d "$KITHARA_CI_CACHE_ROOT"
          test "$KITHARA_CACHE_TRUST" = review
          export KITHARA_FIXTURE_CACHE="$KITHARA_CI_CACHE_ROOT/$KITHARA_CACHE_TRUST/fixtures"
          export KITHARA_BEAT_MODEL_CACHE="$KITHARA_FIXTURE_CACHE/beat-models"
          mkdir -p "$KITHARA_FIXTURE_CACHE" "$KITHARA_BEAT_MODEL_CACHE"
          mkdir -p .ci-artifacts/signalsmith
          printf '%s\n' "$GITHUB_SHA" > .ci-artifacts/signalsmith/controller-sha.txt
          git rev-parse HEAD | tee .ci-artifacts/signalsmith/subject-sha.txt
          export KITHARA_AUDIO_ARTIFACT_DIR="$PWD/.ci-artifacts/signalsmith/audio"
          export KITHARA_HANG_DUMP_DIR="$PWD/.ci-artifacts/signalsmith/hang"
          mkdir -p "$KITHARA_HANG_DUMP_DIR"
          export RUSTUP_TOOLCHAIN="$(sed -n 's/^nightly_toolchain = "\(.*\)"$/\1/p' .config/ci-pins.toml)"
          test -n "$RUSTUP_TOOLCHAIN"
          printf '%s\n' "$RUSTUP_TOOLCHAIN" > .ci-artifacts/signalsmith/toolchain.txt
          rustc -Vv | tee .ci-artifacts/signalsmith/rustc-version.txt
          test_filter='package(kithara-warp-tests) & binary(=warp_playback) & test(=speed_change::a_speed_change_keeps_every_beat_on_the_source_it_opened_signalsmith)'
          printf 'lane=workspace\nflash=off\nno-block=off\nprofile=ci\nfilter=%s\nRUST_LOG=%s\naudio_artifact_dir=%s\ncargo_target=%s\ntrust=%s\ncache_root=%s\nfixtures=%s\nbeat_models=%s\n' \
            "$test_filter" "$RUST_LOG" "$KITHARA_AUDIO_ARTIFACT_DIR" "${CARGO_TARGET_DIR:-}" \
            "$KITHARA_CACHE_TRUST" "$KITHARA_CI_CACHE_ROOT" "$KITHARA_FIXTURE_CACHE" "$KITHARA_BEAT_MODEL_CACHE" \
            > .ci-artifacts/signalsmith/request.txt
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          export GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $auth"
          set +e
          just test run --lane workspace --flash=off --no-block=off --profile ci --timings \
            -E "$test_filter" --success-output=final --failure-output=immediate-final \
            2>&1 | tee .ci-artifacts/signalsmith/nextest-probe.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > .ci-artifacts/signalsmith/harness-exit.txt
          exit "$status"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signalsmith-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .ci-artifacts/signalsmith/
            target/nextest/ci/junit.xml
