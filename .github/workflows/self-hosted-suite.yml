name: Suite (self-hosted)

# Nothing here starts on its own. A push or a schedule would queue work in every
# copy of this repository, including those without runners, so the suite is
# dispatched by hand or by whoever owns the machines.
on:
  workflow_dispatch:

concurrency:
  group: kithara-self-hosted
  cancel-in-progress: false

jobs:
  suite:
    name: Workspace suite on x86_64
    # Set only where self-hosted runners exist. Elsewhere the job never starts,
    # so the workflow can live in every copy of the tree without dispatching
    # work that nothing can serve.
    if: vars.KITHARA_SELF_HOSTED == 'true'
    runs-on: [self-hosted, linux, x64, kithara]
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The runner image carries the toolchain, so there is nothing to install.
      - name: Run the workspace suite
        run: just test
