name: Isolated issue validation

on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options: [all, source-gates]
        default: all
      checks_revision:
        description: Immutable fork revision for format and fast lint checks
        type: string
        default: 0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  KITHARA_FIXTURE_CACHE: /cache/fixtures
  KITHARA_CI_CACHE_ROOT: /cache/target/.kithara-ci
  CARGO_BUILD_JOBS: '2'

concurrency:
  group: isolated-issue-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit only the fork owner on the isolated validation ref
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          IS_FORK: ${{ github.event.repository.fork }}
          REF: ${{ github.ref }}
          RUNNER_LABELS: ${{ vars.KITHARA_RUNNER_LABELS }}
          GPU_RUNNER_LABELS: ${{ vars.KITHARA_GPU_RUNNER_LABELS }}
          CHECKS_REVISION: ${{ inputs.checks_revision }}
        run: |
          set -euo pipefail
          [[ "$IS_FORK" == true && "$ACTOR" == "$OWNER" && "$TRIGGERING_ACTOR" == "$OWNER" ]]
          [[ "$REF" == refs/heads/codex/ci-issue-validation-2026-10-05 ]]
          [[ "$CHECKS_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]
          python3 - <<'PY'
          import json
          import os
          for name in ('RUNNER_LABELS', 'GPU_RUNNER_LABELS'):
              labels = json.loads(os.environ[name])
              assert isinstance(labels, list) and labels
              assert all(isinstance(label, str) and label for label in labels)
              assert {'self-hosted', 'linux', 'x64'}.issubset(labels)
          PY

  store-contract:
    name: Issue 347 actual store contract
    needs: authorize
    if: inputs.scope == 'all'
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60
    steps:
      - name: Checkout immutable subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8bd233fa27b757d1a268319918a3e81ccceeff13
          persist-credentials: false
      - name: Scope Cargo dependency fetch authorization
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          {
            echo 'GIT_CONFIG_COUNT=2'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
            echo 'GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader'
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic $auth"
          } >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/kithara-validation-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Record provenance and run the existing owner harness
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' "$GITHUB_SHA" > validation/controller-sha.txt
          git rev-parse HEAD | tee validation/subject-sha.txt
          test "$(git rev-parse HEAD)" = 8bd233fa27b757d1a268319918a3e81ccceeff13
          just test run --net-backend=none --flash=off -p kithara-test-fixtures --features kithara-test-fixtures/all -E 'binary(store_contract)' 2>&1 | tee validation/store-contract.log
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-347-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
          if-no-files-found: error

  ui-probes:
    name: Issue 327 final feature compile probes
    needs: authorize
    if: inputs.scope == 'all'
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60
    steps:
      - name: Checkout immutable subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2
          persist-credentials: false
      - name: Scope Cargo dependency fetch authorization
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          {
            echo 'GIT_CONFIG_COUNT=2'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
            echo 'GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader'
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic $auth"
          } >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/kithara-validation-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Record subject identity
        run: |
          mkdir -p validation
          printf '%s\n' "$GITHUB_SHA" > validation/controller-sha.txt
          git rev-parse HEAD | tee validation/subject-sha.txt
          test "$(git rev-parse HEAD)" = 0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2
      - name: Check final host feature closures and hostless owner warnings
        run: |
          set -uo pipefail
          status=0
          for features in render render,vello iced masonry iced,masonry; do
            cargo check -p kithara-ui --lib --no-default-features --features "$features" --message-format=json > "validation/$features.jsonl" 2> "validation/$features.stderr" || status=1
          done
          python3 - <<'PY' || status=1
          import json
          from pathlib import Path
          counts = {}
          for features in ('render', 'render,vello', 'iced', 'masonry', 'iced,masonry'):
              messages = [json.loads(line) for line in Path(f'validation/{features}.jsonl').read_text().splitlines()]
              assert any(message.get('reason') == 'build-finished' and message.get('success') for message in messages), features
              assert any(message.get('reason') == 'compiler-artifact' and '/crates/kithara-ui#' in message.get('package_id', '') for message in messages), features
              warnings = [message for message in messages if message.get('reason') == 'compiler-message' and '/crates/kithara-ui#' in message.get('package_id', '') and message['message']['level'] == 'warning']
              counts[features] = len(warnings)
          Path('validation/owner-warning-counts.json').write_text(json.dumps(counts, indent=2) + '\n')
          print(counts)
          assert counts['render'] == 0 and counts['render,vello'] == 0, counts
          PY
          exit "$status"
      - name: Preserve compile and gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-327-probes-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
          if-no-files-found: error

  ui-acceptance:
    name: Issue 327 real UI acceptance
    needs: authorize
    if: inputs.scope == 'all'
    runs-on: ${{ fromJSON(vars.KITHARA_GPU_RUNNER_LABELS) }}
    timeout-minutes: 120
    steps:
      - name: Checkout immutable subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2
          persist-credentials: false
      - name: Scope Cargo dependency fetch authorization
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          {
            echo 'GIT_CONFIG_COUNT=2'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
            echo 'GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader'
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic $auth"
          } >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/kithara-validation-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Record subject identity and execute the existing UI lane
        run: |
          set -euo pipefail
          mkdir -p validation
          printf '%s\n' "$GITHUB_SHA" > validation/controller-sha.txt
          git rev-parse HEAD | tee validation/subject-sha.txt
          test "$(git rev-parse HEAD)" = 0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2
          just ci lane deep-ui --kind nightly 2>&1 | tee validation/ui-acceptance.log
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-327-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation
            target/parity
          if-no-files-found: error

  source-gates:
    name: Exact subject format and fast lint checks
    needs: authorize
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60
    steps:
      - name: Checkout immutable subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checks_revision }}
          persist-credentials: false
      - name: Scope Cargo dependency fetch authorization
        env:
          GITHUB_FETCH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          {
            echo 'GIT_CONFIG_COUNT=2'
            echo 'GIT_CONFIG_KEY_0=http.https://github.com/gerasim13/bevy_seedling.extraheader'
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
            echo 'GIT_CONFIG_KEY_1=http.https://github.com/RustSec/advisory-db.extraheader'
            echo "GIT_CONFIG_VALUE_1=AUTHORIZATION: basic $auth"
          } >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/kithara-validation-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: Record subject identity
        id: subject
        env:
          EXPECTED_SHA: ${{ inputs.checks_revision }}
        run: |
          mkdir -p validation
          printf '%s\n' "$GITHUB_SHA" > validation/controller-sha.txt
          git rev-parse HEAD | tee validation/subject-sha.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check repository fast lint gate
        run: just lint fast 2>&1 | tee validation/lint-fast.log
      - name: Check formatting and preserve any required source patch
        if: ${{ always() && !cancelled() && steps.subject.outcome == 'success' }}
        run: |
          set +e
          just fmt check 2>&1 | tee validation/fmt-check.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            just fmt > validation/fmt-apply.log 2>&1
            git diff --binary > validation/format.patch
          fi
          exit "$status"
      - name: Preserve gate results and formatting patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-gates-${{ inputs.checks_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation
          if-no-files-found: error
