name: Nightly report

# The source scheduled run keeps its own verdict. This GitHub-hosted collector
# only makes that result visible without depending on repository Issues or the
# self-hosted runner fleet being healthy.
on:
  workflow_run:
    workflows: ["Scheduled runs"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: nightly-report
  cancel-in-progress: false

jobs:
  report:
    name: Summarize the nightly result
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Collect the source run jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p target

          {
            echo "# Nightly result"
            echo
            echo "- Source run: [$RUN_ID]($RUN_URL)"
            echo "- Source conclusion: \`$RUN_CONCLUSION\`"
          } > target/nightly-report.md

          failing=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- [\(.name)](\(.html_url)) (`\(.conclusion)`)"')

          {
            echo
            echo "## Unsuccessful jobs"
            echo
            if [[ -n "$failing" ]]; then
              echo "$failing"
            else
              echo "No source jobs failed."
            fi
          } >> target/nightly-report.md

          # The quality cron assembles its own consolidated report (`just ci
          # report`) and archives it, so this collector carries the numbers
          # rather than re-deriving them. Only that cron produces one, so a
          # missing artifact is a normal state for the other crons.
          if gh run download "$RUN_ID" --repo "$REPOSITORY" --name quality-report --dir quality \
              && [[ -f quality/quality-report.md ]]; then
            {
              echo
              cat quality/quality-report.md
            } >> target/nightly-report.md
          fi

          cat target/nightly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the nightly report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-report-${{ github.event.workflow_run.id }}
          path: target/nightly-report.md
