name: Host

# Calling pipelines prepare their pinned images before Linux jobs start.
# Full service provisioning is a separate, explicitly requested operation.
on:
  workflow_call:
    inputs:
      operation:
        description: Prepare images for the calling pipeline
        type: string
        default: images
  workflow_dispatch:
    inputs:
      operation:
        description: Host operation
        required: true
        default: provision
        type: choice
        options:
          - provision
          - images

# The host serves one provisioning pass at a time. A second would rebuild the
# images the first is installing services against.
concurrency:
  group: host-provision-${{ github.repository }}
  cancel-in-progress: false

jobs:
  provision:
    name: provision
    # The machine itself, not one of the throwaway runner containers: a
    # container has neither the Docker daemon that holds the images nor the
    # systemd that owns the units. One dedicated native JIT runner lives on
    # the host and serves only this.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ vars.KITHARA_HOST_RUNNER_LABEL }}
    timeout-minutes: 180

    steps:
      - name: Validate host operation
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            images|provision) ;;
            *) echo "unknown host operation: $OPERATION" >&2; exit 2 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision this machine
        if: inputs.operation == 'provision'
        run: cargo run --locked -p xtask -- ci host provision

      - name: Build pinned CI images
        if: inputs.operation == 'images'
        run: cargo run --locked -p xtask -- ci host linux images
