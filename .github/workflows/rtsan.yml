name: RTSan

# RealtimeSanitizer gate for the audio produce-core.
#
# Compiles the player RT path under `-Zsanitizer=realtime --cfg rtsan` and runs
# the offline-render produce-core lanes without an audio device. Any malloc /
# lock / syscall reached inside a `#[kithara::rtsan_forbid_blocking]` region
# (the worker produce-core, kithara-play `process()`) aborts the run unless
# wrapped by a documented `#[kithara::rtsan_allow_blocking]`.
#
# The read/seek path is verified kevent/yield-free (wake, on-core seek, and FSM
# AudioEvent emission are all deferred off the forbid path); see
# kithara-play/README.md "Real-Time Audio Thread".
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# This soak runs on the pool the stress campaign measures, so on a fork it
# waits for the campaign rather than taking cores from it. See ci.yml.
concurrency:
  group: ${{ github.event.repository.fork && format('fork-linux-{0}', github.repository) || format('rtsan-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    name: CI authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate actor and runner labels
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          RUNNER_LABELS: ${{ vars.KITHARA_RUNNER_LABELS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          if actor != owner:
              print(f"CI may only be started by repository owner {owner!r}, got {actor!r}")
              sys.exit(1)

          raw_labels = os.environ.get("RUNNER_LABELS", "")
          try:
              labels = json.loads(raw_labels)
          except json.JSONDecodeError as error:
              print(f"KITHARA_RUNNER_LABELS is not valid JSON: {error}")
              sys.exit(1)
          if not isinstance(labels, list) or not labels or not all(
              isinstance(label, str) and label for label in labels
          ):
              print("KITHARA_RUNNER_LABELS must be a non-empty JSON array of non-empty strings")
              sys.exit(1)
          PY

  rtsan:
    name: RTSan ${{ matrix.lane }}
    needs: authorize
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane:
          - rtsan        # mock decoder (suite_light, fast tripwire)
          - rtsan-file   # real-decoder file-offline (suite_stress)
          - rtsan-hls    # real-decoder HLS-offline (suite_stress)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The sanitizer needs the pinned nightly, which the image already carries
      # and names, so the toolchain stays owned by the reviewed pins.
      - name: Run RTSan lane
        env:
          LANE: ${{ matrix.lane }}
        run: just test "$LANE"
