name: Windows guest provisioning

# One-off: the Windows guest is provisioned by hand and carries its own
# toolchain. It never had FFmpeg, so `ffmpeg-sys-next` fell through to vcpkg
# and found nothing. The runner is the only channel into the guest.
on:
  push:
    branches: [ci/windows-guest-ffmpeg]

jobs:
  provision:
    name: Install FFmpeg into the guest
    runs-on: ${{ fromJSON(vars.KITHARA_WINDOWS_RUNNER_LABELS) }}
    timeout-minutes: 60
    steps:
      - name: Install the prebuilt FFmpeg the crate expects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'ffmpeg-stage'
          $dest = 'C:\kithara-ci\ffmpeg'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Expand-Archive -Path $zip -DestinationPath $stage
          $root = (Get-ChildItem -Directory $stage | Select-Object -First 1).FullName
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Move-Item $root $dest
          Get-ChildItem $dest

      - name: Point the machine at it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\kithara-ci\ffmpeg'
          [Environment]::SetEnvironmentVariable('FFMPEG_DIR', $dest, 'Machine')
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($path -notlike "*$dest\bin*") {
            [Environment]::SetEnvironmentVariable('Path', "$path;$dest\bin", 'Machine')
          }
          [Environment]::GetEnvironmentVariable('FFMPEG_DIR', 'Machine')
          & "$dest\bin\ffmpeg.exe" -hide_banner -version
