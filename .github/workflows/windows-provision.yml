name: Windows guest provisioning

# One-off: the Windows guest is provisioned by hand and carries its own
# toolchain. It never had FFmpeg, so `ffmpeg-sys-next` fell through to vcpkg
# and found nothing. The runner is the only channel into the guest.
on:
  push:
    branches: [ci/windows-guest-ffmpeg]

jobs:
  provision:
    name: Install FFmpeg into the guest
    runs-on: ${{ fromJSON(vars.KITHARA_WINDOWS_RUNNER_LABELS) }}
    timeout-minutes: 60
    steps:
      - name: Install the prebuilt FFmpeg the crate expects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'ffmpeg-stage'
          $dest = 'C:\kithara-ci\ffmpeg'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Expand-Archive -Path $zip -DestinationPath $stage
          $root = (Get-ChildItem -Directory $stage | Select-Object -First 1).FullName
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Move-Item $root $dest
          Get-ChildItem $dest

      - name: Install libclang, which bindgen loads at build time
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-win64.msi'
          $msi = Join-Path $env:RUNNER_TEMP 'llvm.msi'
          $dest = 'C:\kithara-ci\llvm'
          Invoke-WebRequest -Uri $url -OutFile $msi
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          # An administrative install unpacks the payload and needs no
          # elevation, which the runner account does not have.
          $p = Start-Process msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=$dest") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode)" }
          Get-ChildItem -Recurse -Filter 'libclang.dll' $dest | Select-Object -ExpandProperty FullName

      - name: Hand it to the runner service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\kithara-ci\ffmpeg'
          # The runner account is not an administrator, so the machine
          # environment is closed to it. The service reads this file when it
          # starts, and what it reads is what every lane inherits.
          $file = 'C:\kithara-ci\runner\.env'
          $lines = @()
          if (Test-Path $file) {
            $lines = @(Get-Content $file | Where-Object { $_ -notmatch '^(FFMPEG_DIR|PATH)=' })
          }
          $lines += "FFMPEG_DIR=$dest"
          $lines += "PATH=$env:PATH;$dest\bin"
          Set-Content -Path $file -Value $lines -Encoding ASCII
          Get-Content $file
          & "$dest\bin\ffmpeg.exe" -hide_banner -version
