name: CI

# Nothing here reacts to a pull request. A self-hosted runner executes whatever
# the checked-out tree tells it to, so a fork proposing a branch must never be
# able to start one; only a push to a copy of this repository can.
on:
  push:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# One runner serves one job at a time, so a new push should not leave the queue
# holding work for a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single gate every other job depends on. `KITHARA_RUNNER_LABELS` names
  # the runners to use and is set only where runners are attached, so a copy of
  # this repository without them skips this job and, with it, the whole
  # workflow. Neither an owner nor a machine is written into the workflow.
  gate:
    name: Self-hosted gate
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 5
    steps:
      - name: Confirm the runner is reachable
        run: just --version

  lint:
    name: Lint
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      # The runner image carries the toolchain, so regular jobs install no
      # packages. The advisory browser lane below is the deliberate exception:
      # it provisions a reviewed Chrome/ChromeDriver pair for each run.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run lint checks
        run: just lint full

  test:
    name: Tests (simulated clock)
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: just test all

  # The virtual clock collapses fixture delays, so order-of-service defects
  # cannot reproduce above. Own target dir: the two builds differ.
  test-real-clock:
    name: Tests (real clock)
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests on a real clock
        run: CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/flash-off" just test run --flash=off

  msrv:
    name: MSRV
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image knows which toolchain is the minimum supported one, so the
      # version stays owned by the reviewed pins rather than repeated here.
      - name: Check the minimum supported toolchain
        run: RUSTUP_TOOLCHAIN="${KITHARA_MSRV_TOOLCHAIN}" just check

  deny:
    name: cargo-deny
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-deny
        run: just deps deny

  arch:
    name: Architecture checks
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run architecture checks
        run: just lint arch

  wasm:
    name: WASM checks
    needs: gate
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run wasm checks
        run: just platform wasm

  wasm-browser:
    name: Chromium WebCodecs (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the reviewed browser pin
        id: browser-pin
        shell: bash
        run: |
          version="$(sed -n 's/^chrome_for_testing_version = "\([^"]*\)"$/\1/p' .config/ci-pins.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Chromium and ChromeDriver
        id: browser
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: ${{ steps.browser-pin.outputs.version }}
          install-chromedriver: true
          no-sudo: true

      - name: Expose browser commands to the WASM recipe
        shell: bash
        env:
          CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.browser.outputs.chromedriver-path }}
        run: |
          test -x "$CHROME_PATH"
          test -x "$CHROMEDRIVER_PATH"
          browser_bin="$RUNNER_TEMP/kithara-browser-bin"
          mkdir -p "$browser_bin"
          ln -s "$CHROME_PATH" "$browser_bin/chromium"
          ln -s "$CHROMEDRIVER_PATH" "$browser_bin/chromedriver"
          echo "$browser_bin" >> "$GITHUB_PATH"

      - name: Run the Chromium browser lane
        run: just test wasm chrome webcodecs

  machete:
    name: cargo-machete (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-machete
        run: just deps machete

  wasm-size:
    name: WASM size budget (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run wasm-slim check
        run: just platform wasm size-check

      - name: Upload wasm-slim report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-slim-report
          path: target/wasm-slim-result.json

  hack:
    name: Feature powerset (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cargo-hack
        run: just deps hack

  semver:
    name: Semver checks (advisory)
    needs: gate
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      # The baseline is a revision, so the history holding it must be here.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run semver checks
        run: just deps semver

  # Real-time correctness is what this product is for: an allocation or a lock
  # on the audio thread is a dropout, not a slow path. It ran nightly, which
  # meant learning about it the morning after the push that caused it.
  #
  # The fast lane is a tripwire over the mock decoder and blocks. The two
  # real-decoder soaks stay advisory for now — they carry findings older than
  # this change, and turning them blocking before those are closed would stop
  # every push on a defect nobody introduced today.
  rtsan:
    name: RealtimeSanitizer
    needs: gate
    uses: ./.github/workflows/rtsan.yml

  # Memory is the other budget a player cannot overrun quietly: pool budgets,
  # allocation regressions, a zero-allocation audio hot path, and the resident
  # size of an HLS playback. `just perf memory` runs all four.
  memory:
    name: Memory budgets
    needs: gate
    if: vars.KITHARA_RUNNER_LABELS != '' && github.actor == github.repository_owner
    runs-on: ${{ fromJSON(vars.KITHARA_RUNNER_LABELS) }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the memory budgets
        run: just perf memory
