name: Stress

# GitHub owns authorization, immutable checkout identity, artifact transport,
# and the trusted reporting boundary. The Rust campaign owns portable work.
on:
  workflow_call:
    inputs:
      revision:
        description: full commit SHA to test; empty uses the triggering commit
        required: false
        type: string
      filter:
        description: nextest expression selecting the tests to repeat
        required: false
        default: all()
        type: string
      count:
        description: repetitions; empty uses KITHARA_STRESS_COUNT
        required: false
        type: string
      flash:
        description: enable Flash hang diagnostics in the subject build
        required: false
        default: true
        type: boolean
      no_block:
        description: enable no-block census in diagnostic mode
        required: false
        default: false
        type: boolean
      dump_thread_backtrace:
        description: include the Flash dump caller backtrace in diagnostic mode
        required: false
        default: false
        type: boolean
      diagnostics:
        description: enable timing-perturbing diagnostic instrumentation
        required: false
        default: false
        type: boolean
      test_threads:
        description: nextest test thread count or num-cpus
        required: false
        default: num-cpus
        type: string
  workflow_dispatch:
    inputs:
      revision:
        description: full commit SHA to test; empty uses the triggering commit
        required: false
        type: string
      filter:
        description: nextest expression selecting the tests to repeat
        required: false
        default: all()
        type: string
      count:
        description: repetitions; empty uses KITHARA_STRESS_COUNT
        required: false
        type: string
      flash:
        description: enable Flash hang diagnostics in the subject build
        required: false
        default: true
        type: boolean
      no_block:
        description: enable no-block census in diagnostic mode
        required: false
        default: false
        type: boolean
      dump_thread_backtrace:
        description: include the Flash dump caller backtrace in diagnostic mode
        required: false
        default: false
        type: boolean
      diagnostics:
        description: enable timing-perturbing diagnostic instrumentation
        required: false
        default: false
        type: boolean
      test_threads:
        description: nextest test thread count or num-cpus
        required: false
        default: num-cpus
        type: string

concurrency:
  group: fork-linux-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  authorize:
    name: Stress authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fork owner and runner configuration
        env:
          ACTOR: ${{ github.actor }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT || '50' }}
          ENABLED: ${{ vars.KITHARA_STRESS_ENABLED }}
          FILTER: ${{ inputs.filter || 'all()' }}
          IS_FORK: ${{ github.event.repository.fork }}
          MAX_COUNT: ${{ vars.KITHARA_STRESS_MAX_COUNT }}
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ inputs.revision || github.sha }}
          RUNNER_LABELS: ${{ vars.KITHARA_STRESS_RUNNER_LABELS }}
          TEST_THREADS: ${{ inputs.test_threads || 'num-cpus' }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENABLED" == true ]] || { echo "stress runs are disabled"; exit 1; }
          [[ "$IS_FORK" == true ]] || { echo "stress runs require a fork"; exit 1; }
          [[ "$ACTOR" == "$OWNER" ]] || { echo "only the fork owner may start stress"; exit 1; }
          [[ "$TRIGGERING_ACTOR" == "$OWNER" ]] || { echo "only the fork owner may re-run stress"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "revision must be a full SHA"; exit 1; }
          [[ -n "${FILTER//[[:space:]]/}" ]] || { echo "filter must not be empty"; exit 1; }
          [[ "$MAX_COUNT" =~ ^([1-9]|[1-9][0-9]|100)$ ]] || { echo "invalid maximum count"; exit 1; }
          [[ "$COUNT" =~ ^([1-9]|[1-9][0-9]|100)$ ]] || { echo "invalid count"; exit 1; }
          (( 10#$COUNT <= 10#$MAX_COUNT )) || { echo "count exceeds repository maximum"; exit 1; }
          if [[ "$TEST_THREADS" != num-cpus ]]; then
            [[ "$TEST_THREADS" =~ ^[0-9]+$ ]] || { echo "invalid test thread count"; exit 1; }
            (( 10#$TEST_THREADS >= 1 && 10#$TEST_THREADS <= 256 )) || { echo "invalid test thread count"; exit 1; }
          fi
          jq -e '
            type == "array"
            and length > 0
            and all(.[]; type == "string" and length > 0)
            and (["self-hosted", "linux", "x64", "kithara"] - . | length == 0)
          ' <<< "$RUNNER_LABELS" >/dev/null || {
            echo "runner labels must include self-hosted, linux, x64, and kithara"
            exit 1
          }

  execute:
    name: Repeated run
    needs: authorize
    if: >-
      ${{ github.event.repository.fork == true &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner &&
          vars.KITHARA_STRESS_ENABLED == 'true' &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'self-hosted') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'linux') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'x64') &&
          contains(fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS), 'kithara') }}
    runs-on: ${{ fromJSON(vars.KITHARA_STRESS_RUNNER_LABELS) }}
    timeout-minutes: 1380
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Checkout subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: subject
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ inputs.revision || github.sha }}

      - name: Install just
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just

      - name: Run the stress campaign
        working-directory: controller
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT || '50' }}
          DIAGNOSTICS: ${{ inputs.diagnostics && 'true' || 'false' }}
          DUMP_THREAD_BACKTRACE: ${{ inputs.dump_thread_backtrace && 'true' || 'false' }}
          FILTER: ${{ inputs.filter || 'all()' }}
          FLASH: ${{ inputs.flash && 'true' || 'false' }}
          NO_BLOCK: ${{ inputs.no_block && 'true' || 'false' }}
          SUBJECT_SHA: ${{ inputs.revision || github.sha }}
          TEST_THREADS: ${{ inputs.test_threads || 'num-cpus' }}
        run: |
          just ci stress \
            --subject-root "$GITHUB_WORKSPACE/subject" \
            --output "$RUNNER_TEMP/kithara-stress/raw" \
            --filter "$FILTER" \
            --count "$COUNT" \
            --test-threads "$TEST_THREADS" \
            --flash "$FLASH" \
            --diagnostics "$DIAGNOSTICS" \
            --no-block "$NO_BLOCK" \
            --dump-thread-backtrace "$DUMP_THREAD_BACKTRACE" \
            --expected-controller-sha "$CONTROLLER_SHA" \
            --expected-subject-sha "$SUBJECT_SHA" \
            --job-timeout-minutes 1380

      - name: Upload the raw stress evidence
        if: always()
        id: raw-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kithara-stress/raw
          if-no-files-found: error
          retention-days: 14

      - name: Export artifact identity
        if: always()
        id: artifact-name
        env:
          UPLOAD_OUTCOME: ${{ steps.raw-upload.outcome }}
        run: |
          [[ "$UPLOAD_OUTCOME" == success ]] || exit 1
          echo "name=stress-raw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  report:
    name: Report evidence
    needs: execute
    if: ${{ always() && needs.execute.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: controller
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Download the raw stress evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.execute.outputs.artifact-name }}
          path: raw

      - name: Install just
        if: always()
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: just

      - name: Verify and render the stress evidence
        if: always()
        working-directory: controller
        env:
          CONTROLLER_SHA: ${{ job.workflow_sha }}
          COUNT: ${{ inputs.count || vars.KITHARA_STRESS_COUNT || '50' }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          FILTER: ${{ inputs.filter || 'all()' }}
          FLASH: ${{ inputs.flash && 'true' || 'false' }}
          MODE: ${{ inputs.diagnostics && 'diagnostic' || 'reproduction' }}
          NO_BLOCK: ${{ inputs.no_block && 'true' || 'false' }}
          DUMP_THREAD_BACKTRACE: ${{ inputs.dump_thread_backtrace && 'true' || 'false' }}
          SUBJECT_SHA: ${{ inputs.revision || github.sha }}
          TEST_THREADS: ${{ inputs.test_threads || 'num-cpus' }}
        run: |
          just ci stress-report \
            --raw "$GITHUB_WORKSPACE/raw" \
            --output "$GITHUB_WORKSPACE/target/stress-report.md" \
            --expected-controller-sha "$CONTROLLER_SHA" \
            --expected-subject-sha "$SUBJECT_SHA" \
            --expected-filter "$FILTER" \
            --expected-count "$COUNT" \
            --expected-test-threads "$TEST_THREADS" \
            --expected-mode "$MODE" \
            --expected-flash "$FLASH" \
            --expected-no-block "$NO_BLOCK" \
            --expected-dump-thread-backtrace "$DUMP_THREAD_BACKTRACE" \
            --expected-job-timeout-minutes 1380 \
            --execute-result "$EXECUTE_RESULT"

      - name: Add the stress summary
        if: always()
        run: |
          if [[ -s "$GITHUB_WORKSPACE/target/stress-report.md" ]]; then
            cat "$GITHUB_WORKSPACE/target/stress-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Stress report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw
            target/stress-report.md
          retention-days: 14
