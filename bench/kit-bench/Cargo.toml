[package]
name = "kit-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["symphonia"]
symphonia = ["kithara/symphonia"]
apple = ["kithara/apple"]

[dependencies]
kithara = { path = "../../crates/kithara", default-features = false, features = [
  "hls",
  "file",
  "client-reqwest",
  "tls-rustls",
  "tokio-net",
  "tokio-rt-multi-thread",
] }
libc = "0.2"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
url = "2"

[workspace]
