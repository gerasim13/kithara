stages:
  - dispatch

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # A branch with an open merge request is already covered by the
    # merge-request pipeline. A second pipeline on the same commit would take
    # the one Apple host twice to report the same thing.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KITHARA_RELEASE_VERSION =~ /^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_QUARANTINE_SHA
    # Asking for a platform is only possible on a run that carries variables,
    # and a push carries none. This is that door: "Run pipeline" with
    # `KITHARA_PLATFORMS` set. It is deliberately narrow — without the variable
    # the run would only repeat what a push already does.
    - if: $CI_PIPELINE_SOURCE == "web" && $KITHARA_PLATFORMS
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_PLATFORMS
    - when: never

.serialized:
  stage: dispatch
  resource_group: kithara-mac-mini
  variables:
    # The child pipeline gates its platform includes on this, and it does not
    # see what the run was started with unless the trigger forwards it. Unset
    # is the ordinary case and means Apple alone.
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend

dispatch:merge-request:
  extends: .serialized
  interruptible: true
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: merge-request
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Work in progress reaching the Apple host on its own, before anyone opens a
# merge request. It answers a question rather than guarding anything, so it
# takes neither the verdict nor the queue from the pipelines that do: the
# trigger is allowed to fail, and it holds a resource group of its own, so a
# push can never make `dispatch:main` or a merge request wait behind an hour of
# somebody's branch. Measurement stays honest regardless — the suites, the
# simulator run and every perf lane share `kithara-suite` across pipelines, so
# one of them still holds the machine at a time.
dispatch:branch:
  stage: dispatch
  resource_group: kithara-mac-mini-branch
  allow_failure: true
  interruptible: true
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: branch
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# The same subset a branch push runs, started by hand to name platforms a push
# cannot. It shares the branch queue rather than the main one, so asking for
# Linux or Windows never puts the default branch behind it.
dispatch:platforms:
  stage: dispatch
  resource_group: kithara-mac-mini-branch
  allow_failure: true
  interruptible: true
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: branch
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $KITHARA_PLATFORMS
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_PLATFORMS

dispatch:main:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: main
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dispatch:quarantine:
  extends: .serialized
  interruptible: true
  variables:
    KITHARA_CACHE_TRUST: quarantine
    KITHARA_PIPELINE_KIND: quarantine
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_QUARANTINE_SHA

dispatch:nightly:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $KITHARA_SCHEDULE_KIND == "nightly"

dispatch:weekly:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: weekly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $KITHARA_SCHEDULE_KIND == "weekly"

dispatch:release:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: release
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KITHARA_RELEASE_VERSION =~ /^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
