stages:
  - dispatch

variables:
  # `KITHARA_PLATFORMS: $KITHARA_PLATFORMS` below forwards a platform request to
  # the child. An undefined variable does not expand to nothing there — it stays
  # the literal `$KITHARA_PLATFORMS`, which `rules:if` then reads as a value.
  # That is how `dispatch:platforms` matched a quarantine run naming no platform
  # and put a second Apple matrix on the one host. Declaring it here is what
  # makes unset mean unset; a run that names platforms overrides it.
  KITHARA_PLATFORMS: ""

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # The bridge creates the quarantine pipeline itself and watches that one by
    # id. The push that places the commit adds a second pipeline nobody reads,
    # and the two then compete for the single Apple host.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^quarantine\//
      when: never
    # A branch with an open merge request is already covered by the
    # merge-request pipeline. A second pipeline on the same commit would take
    # the one Apple host twice to report the same thing.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KITHARA_RELEASE_VERSION =~ /^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_QUARANTINE_SHA
    # Asking for a platform is only possible on a run that carries variables,
    # and a push carries none. This is that door: "Run pipeline" with
    # `KITHARA_PLATFORMS` set. It is deliberately narrow — without the variable
    # the run would only repeat what a push already does.
    - if: $CI_PIPELINE_SOURCE == "web" && $KITHARA_PLATFORMS
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_PLATFORMS
    - when: never

.serialized:
  stage: dispatch
  resource_group: kithara-mac-mini
  variables:
    # The child pipeline gates its platform includes on this, and it does not
    # see what the run was started with unless the trigger forwards it. Unset
    # is the ordinary case and means Apple alone.
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend

dispatch:merge-request:
  extends: .serialized
  interruptible: true
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: merge-request
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Work in progress reaches the Apple host on its own, before anyone opens a
# merge request. The child verdict propagates through `strategy: depend`, while
# a resource group of its own prevents a branch push from making
# `dispatch:main` or a merge request wait behind an hour of somebody's branch.
# Measurement stays honest regardless — the suites, the simulator run and
# every perf lane share `kithara-suite` across pipelines, so one of them still
# holds the machine at a time.
dispatch:branch:
  stage: dispatch
  resource_group: kithara-mac-mini-branch
  interruptible: true
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: branch
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

# Started by hand to name platforms a push cannot. It runs as the `main` kind
# rather than `branch`, because that is the kind under which the platform lanes
# exist at all: `linux:*` hangs off the verify set, the web and Android lanes
# off the integration set, and neither admits `branch`. Asking for a platform
# on a branch kind would silently produce the Apple-only pipeline and look like
# the switch was ignored. The branch queue keeps it out of the default branch's
# way regardless.
dispatch:platforms:
  stage: dispatch
  resource_group: kithara-mac-mini-branch
  allow_failure: true
  interruptible: true
  trigger:
    include:
      - local: .gitlab/ci/pipeline.yml
    strategy: depend
  variables:
    KITHARA_CACHE_TRUST: review
    KITHARA_PIPELINE_KIND: main
    KITHARA_PLATFORMS: $KITHARA_PLATFORMS
  rules:
    # A quarantine run is started through the API too, and if the project
    # carries a `KITHARA_PLATFORMS` value this matched it: one import then took
    # the host for the platform matrix as well, which is not what verifies the
    # import and which finished by failing. The quarantine sha says whose run
    # this is, so it answers first.
    - if: $KITHARA_QUARANTINE_SHA
      when: never
    - if: $CI_PIPELINE_SOURCE == "web" && $KITHARA_PLATFORMS
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_PLATFORMS

dispatch:main:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: main
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dispatch:quarantine:
  extends: .serialized
  interruptible: true
  variables:
    KITHARA_CACHE_TRUST: quarantine
    KITHARA_PIPELINE_KIND: quarantine
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $KITHARA_QUARANTINE_SHA

dispatch:nightly:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $KITHARA_SCHEDULE_KIND == "nightly"

dispatch:weekly:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: weekly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $KITHARA_SCHEDULE_KIND == "weekly"

dispatch:release:
  extends: .serialized
  interruptible: false
  variables:
    KITHARA_CACHE_TRUST: trusted
    KITHARA_PIPELINE_KIND: release
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KITHARA_RELEASE_VERSION =~ /^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$/
