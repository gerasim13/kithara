workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_REF_NAME == "codex/ci-issue-validation-macos-2026-10-05"
    - when: never

stages:
  - validation

variables:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  GIT_DEPTH: '0'
  GIT_CLEAN_FLAGS: -ffdx -e target -e target-flash-off
  KITHARA_CI_HOST_CONFIG: /etc/kithara-ci/mac-host.toml
  RUST_BACKTRACE: '1'
  CARGO_BUILD_JOBS: '2'

validation:ui:
  stage: validation
  tags:
    - kithara-macos
  resource_group: kithara-suite
  timeout: 120 minutes
  cache: []
  script:
    - |
      set -euo pipefail
      subject_sha=0bdd9a21eb4c28b139b1efce8ed1c3f251ed14d2
      mkdir -p validation
      printf '%s\n' "$CI_COMMIT_SHA" > validation/controller-sha.txt
      git switch --detach "$subject_sha"
      test "$(git rev-parse HEAD)" = "$subject_sha"
      git rev-parse HEAD | tee validation/subject-sha.txt
      just test ui 2>&1 | tee validation/ui-acceptance.log
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - validation/
      - target/parity/
