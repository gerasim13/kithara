# Style-check thresholds. Empty file (or missing keys) → defaults from
# `xtask/src/style/config.rs`. Override only what you intend to differ
# from the default.

[comment_hygiene]
inline_max_lines = 3
doc_block_max_lines = 20
fn_density_threshold_pct = 30
fn_density_min_body_lines = 6
allowed_inline_markers = [
  "SAFETY:",
  "TODO:",
  "FIXME:",
  "XXX:",
  "NOTE:",
  "WHY:",
  "HACK:",
  "kithara:",
  "ast-grep-ignore:",
  "xtask-lint-ignore:",
]
exclude_paths = ["**/build.rs", "**/tests/**/fixtures/**"]

[non_english_text]
exclude_paths = [
  "assets/**",
  "**/assets/**",
  "fonts/**",
  "**/fonts/**",
  "models/**",
  "**/models/**",
  "fixtures/**",
  "**/fixtures/**",
  "target/**",
  "**/target/**",
  "docs/plans/**",
  "docs/specs/**",
  "android/gradle/wrapper/**",
]

[dead_doc_refs]
exclude_paths = [
  # lint-check implementations carry synthetic fixture paths in their unit tests
  "**/kithara-devtools/src/style/checks/*.rs",
  "assets/**",
  "**/assets/**",
  "fonts/**",
  "**/fonts/**",
  "models/**",
  "**/models/**",
  "fixtures/**",
  "**/fixtures/**",
  "target/**",
  "**/target/**",
  "docs/plans/**",
  "docs/specs/**",
  "android/gradle/wrapper/**",
]
allow_targets = []

# Document size limits. Prose has no compiler, so an unbounded document grows
# until it no longer fits an agent's context budget. Limits are per document
# class because a crate contract and a crate overview carry different loads.
# Symlinked aliases of a tracked document are excluded: they would report the
# same content several times.
[doc_size]
exclude_paths = [
  "CLAUDE.md",
  "GEMINI.md",
  "WARP.md",
  "CONTEXT.md",
  "ARCHITECTURE.md",
  "docs/plans/**",
  "docs/specs/**",
  "docs/superpowers/**",
]

[[doc_size.limits]]
globs = ["AGENTS.md"]
warn = 150
deny = 170

[[doc_size.limits]]
globs = ["PROGRESS.md"]
warn = 60
deny = 120

[[doc_size.limits]]
globs = ["**/CONTEXT.md"]
warn = 300
deny = 600

[[doc_size.limits]]
globs = ["docs/guides/**/*.md"]
warn = 200
deny = 400

[[doc_size.limits]]
globs = ["**/README.md"]
warn = 150
deny = 300

[doc_staleness]
# Platform, upstream, and illustrative names the workspace sources never define.
allow_terms = [
  "Constraints",
  "HTTPMaximumConnectionsPerHost",
  "LICENSE",
  "LockFileEx",
  "MediaExtractor",
  "MpaDecoder",
  "MyFileAssetLayout",
  "MyHlsAssetLayout",
  "SetGlobalDefault",
  "StateFlow",
  "set_default",
  "unused_self",
]
exclude_paths = [
  "CLAUDE.md",
  "GEMINI.md",
  "WARP.md",
  "CONTEXT.md",
  "ARCHITECTURE.md",
  "docs/plans/**",
  "docs/specs/**",
  "docs/superpowers/**",
]
include_globs = ["AGENTS.md", "**/CONTEXT.md", "**/README.md"]
