id: arch.no-raw-test-fix
message: Replace raw `#[test]` with the workspace test macro.
severity: warning
language: Rust
files:
  - crates/**/src/**/*.rs
ignores:
  - "**/kithara-devtools/**"
  - "**/kithara-encode/**"
  - "**/kithara-fuzz/**"
  - "**/kithara-integration-tests/**"
  - "**/kithara-test-macros/**"
  - "**/kithara-test-utils/**"
rule:
  all:
    - kind: attribute_item
    - regex: '^#\[test\]$'
    - inside:
        kind: mod_item
        has:
          pattern: use kithara_test_utils::kithara;
          stopBy: end
        stopBy: end
fix: "#[kithara::test]"
