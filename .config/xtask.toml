steps = [
  { args = [
    "test",
    "run",
    "--lane=e2e",
    "--profile",
    "ci",
  ], label = "Apple end-to-end suite" },
  { args = [
    "test",
    "run",
    "--lane=e2e-fused",
    "--profile",
    "ci",
  ], label = "Apple end-to-end suite" },
  { args = [
    "test",
    "run",
