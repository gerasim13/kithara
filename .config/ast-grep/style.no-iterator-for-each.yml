id: style.no-iterator-for-each
message: |
  `Iterator::for_each` with a side effect. Write a `for` loop: it reads as
  control flow, and `break`, `continue`, `?` and `return` work in it. Name a
  long iterator chain with a `let` before the loop.
severity: error
language: Rust
files:
  - crates/**/*.rs
rule:
  all:
    - kind: call_expression
    - has:
        field: function
        kind: field_expression
        all:
          - has:
              field: field
              regex: '^for_each$'
          - not:
              has:
                field: value
                regex: '\bpar_\w+\s*\('
    - not:
        inside:
          kind: await_expression
