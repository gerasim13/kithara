id: perf.prefer-primitive-pool
message: |
  Allocating a primitive `Vec` directly in a hot-path crate. Reuse storage
  through the pool injected by the owning subsystem:

    - `Vec<u8>` uses `BytePool`;
    - `Vec<f32>` containing decoded samples uses `SamplePool`;
    - other primitive scratch is reshaped to reuse one of those injected pools.

  The rule covers empty and capacity-bearing constructors, `default`, `vec!`,
  `collect`, `to_vec`, and `repeat` when the primitive type is explicit. An
  empty `Vec` is included conservatively because its first `push`, `extend`,
  `resize`, or `reserve` can allocate outside the injected pool. A bare
  `Vec::new()` whose primitive type is inferred from a later `push`, `resize`,
  or literal extension is covered too. An explicit `collect::<Vec<_>>()` and a
  repeated primitive literal are also rejected conservatively in these crates.
  Component-local pool construction is forbidden.
severity: error
language: Rust
files:
  - crates/kithara-audio/src/**/*.rs
  - crates/kithara-decode/src/**/*.rs
  - crates/kithara-file/src/**/*.rs
  - crates/kithara-hls/src/**/*.rs
  - crates/kithara-resampler/src/**/*.rs
  - crates/kithara-stream/src/**/*.rs
  - crates/kithara-stretch/src/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - "**/benches/**"
rule:
  all:
    - any:
        - all:
            - any:
                - pattern: "let $NAME: Vec<$TYPE> = $ALLOC;"
                - pattern: "let mut $NAME: Vec<$TYPE> = $ALLOC;"
        - pattern: "$ITER.collect::<Vec<_>>()"
        - pattern: "$ITER.collect::<Vec<$TYPE>>()"
        - pattern: "Vec::<$TYPE>::new()"
        - pattern: "Vec::<$TYPE>::default()"
        - pattern: "Vec::<$TYPE>::with_capacity($CAPACITY)"
        - pattern: "Vec::<$TYPE>::from($VALUE)"
        - all:
            - any:
                - pattern: "let mut $NAME = Vec::new();"
                - pattern: "let mut $NAME = Vec::default();"
                - pattern: "let mut $NAME = Default::default();"
            - inside:
                all:
                  - kind: function_item
                  - has:
                      any:
                        - pattern: "$NAME.push($ELEMENT)"
                        - pattern: "$NAME.resize($_, $ELEMENT)"
                        - pattern: "$NAME.extend([$ELEMENT])"
                        - pattern: "$NAME.extend_from_slice(&[$ELEMENT])"
                      stopBy: end
                stopBy: end
        - all:
            - pattern: "vec![$ELEMENT; $CAPACITY]"
            - not:
                inside:
                  any:
                    - pattern: "let $NAME: Vec<$TYPE> = $_;"
                    - pattern: "let mut $NAME: Vec<$TYPE> = $_;"
                  stopBy: end
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b|^#\[test\]$|kithara::test'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
constraints:
  TYPE:
    regex: '^(?:u8|u16|u32|u64|u128|usize|i8|i16|i32|i64|i128|isize|f32|f64|bool|char)$'
  ALLOC:
    regex: '(?s)(?:^vec!\s*\[|^Vec(?:::\s*<[^>]+>)?::(?:new|default|with_capacity|from)\s*\(|^Default::default\s*\(|\.(?:collect(?:\s*::\s*<[^>]+>)?|to_vec|repeat)\s*\()'
  ELEMENT:
    any:
      - kind: integer_literal
      - kind: float_literal
      - kind: boolean_literal
      - kind: char_literal
