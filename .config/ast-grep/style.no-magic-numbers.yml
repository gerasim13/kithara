id: style.no-magic-numbers
message: Magic number detected; extract it into a named constant.
severity: warning
language: Rust
files:
  - crates/**/src/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  any:
    - all:
        - kind: integer_literal
        - not:
            regex: "^(?:(?:0|0x0+)|(?:1|0x0*1)|-1)(?:_?[iu](?:8|16|32|64|128|size))?$"
        - not:
            regex: "^0b[01_]+$"
        - not:
            inside:
              kind: const_item
              stopBy: end
        - not:
            inside:
              kind: static_item
              stopBy: end
        - not:
            inside:
              kind: attribute_item
              regex: '^#\[(?:builder|serde)\('
              stopBy: end
        - not:
            inside:
              kind: field_expression
              field: field
        - not:
            inside:
              kind: enum_variant
              stopBy: end
        - not:
            inside:
              kind: type_arguments
              stopBy: end
        - not:
            inside:
              kind: array_type
              stopBy: end
        - not:
            inside:
              kind: macro_invocation
              stopBy: end
        - not:
            inside:
              any:
                - pattern: $VALUE / 2
                - pattern: $VALUE * 2
                - pattern: 2 * $VALUE
                - pattern: $VALUE % 2
                - pattern: $VALUE.powi(2)
                - pattern: $VALUE.windows(2)
                - pattern: $VALUE / 3
                - pattern: $VALUE * 3
                - pattern: 3 * $VALUE
                - pattern: $VALUE / 4
                - pattern: $VALUE * 4
                - pattern: 4 * $VALUE
                - pattern: $TYPE::from_be_bytes([$$$VALUES])
                - pattern: $TYPE::from_le_bytes([$$$VALUES])
              stopBy: end
        - not:
            inside:
              all:
                - kind: mod_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg(?:_attr)?\([^\n]*test'
                    stopBy: end
              stopBy: end
    - all:
        - kind: float_literal
        - not:
            regex: '^(?:-?1(?:\.0+)?|0(?:\.0+)?)(?:_?f(?:32|64))?$'
        - not:
            inside:
              kind: const_item
              stopBy: end
        - not:
            inside:
              kind: static_item
              stopBy: end
        - not:
            inside:
              kind: attribute_item
              regex: '^#\[(?:builder|serde)\('
              stopBy: end
        - not:
            inside:
              kind: macro_invocation
              regex: '^ranged!'
              stopBy: end
        - not:
            inside:
              any:
                - pattern: $VALUE / 2.0
                - pattern: $VALUE * 2.0
                - pattern: 2.0 * $VALUE
                - pattern: $VALUE.rem_euclid(2.0)
                - pattern: $VALUE / 3.0
                - pattern: $VALUE * 3.0
                - pattern: 3.0 * $VALUE
                - pattern: $VALUE / 4.0
                - pattern: $VALUE * 4.0
                - pattern: 4.0 * $VALUE
                - pattern: $VALUE + 0.5
                - pattern: 0.5 + $VALUE
                - pattern: $VALUE - 0.5
                - pattern: $VALUE * 0.5
                - pattern: 0.5 * $VALUE
              stopBy: end
        - not:
            inside:
              all:
                - kind: mod_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg(?:_attr)?\([^\n]*test'
                    stopBy: end
              stopBy: end
