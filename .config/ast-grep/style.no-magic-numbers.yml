id: style.no-magic-numbers
message: Magic number detected; extract it into a named constant.
severity: warning
language: Rust
files:
  - crates/**/src/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  any:
    - all:
        - kind: integer_literal
        - not:
            inside:
              stopBy: end
              all:
                - any:
                    - kind: function_item
                    - kind: function_signature_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg\(test\)|cfg\(all\(test,'
                    stopBy: end
        - not:
            regex: "^(?:0|1|-1)_?(?:[iu](?:8|16|32|64|128|size))?$"
        - not:
            regex: "^0b[01]+$"
        - not:
            inside:
              kind: const_item
              stopBy: end
        - not:
            inside:
              kind: static_item
              stopBy: end
        - not:
            inside:
              kind: field_expression
              field: field
        - not:
            inside:
              kind: enum_variant
              stopBy: end
        - not:
            inside:
              kind: type_arguments
              stopBy: end
        - not:
            inside:
              kind: macro_invocation
              stopBy: end
        - not:
            inside:
              kind: attribute_item
              stopBy: end
              regex: '\bbuilder\(|\bdefault_value_t\s*='
        - not:
            inside:
              all:
                - kind: mod_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg\(test\)|cfg\(all\(test,'
                    stopBy: end
              stopBy: end
    - all:
        - kind: float_literal
        - not:
            inside:
              stopBy: end
              all:
                - any:
                    - kind: function_item
                    - kind: function_signature_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg\(test\)|cfg\(all\(test,'
                    stopBy: end
        - not:
            inside:
              kind: attribute_item
              stopBy: end
              regex: '\bbuilder\(|\bdefault_value_t\s*='
        - not:
            regex: '^(?:-?1(?:\.0+)?|0(?:\.0+)?)_?(?:f(?:32|64))?$'
        - not:
            inside:
              kind: const_item
              stopBy: end
        - not:
            inside:
              kind: static_item
              stopBy: end
        - not:
            inside:
              all:
                - kind: mod_item
                - follows:
                    kind: attribute_item
                    regex: 'cfg\(test\)|cfg\(all\(test,'
                    stopBy: end
              stopBy: end
