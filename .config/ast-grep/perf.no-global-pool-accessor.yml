id: perf.no-global-pool-accessor
message: |
  Constructing a default `BytePool` / `SamplePool` from a library crate.
  Pools are an injected dependency: the top of the application builds
  one `BytePool` and one `SamplePool` and passes them down through
  config structs or constructor arguments. Library code must read
  the pool from `self`/`cfg`, not call `BytePool::default()` /
  `SamplePool::default()` directly.

      // ❌  let buf = BytePool::default().get_with(...);
      // ✅  let buf = self.byte_pool.get_with(...);
      // ✅  let buf = cfg.sample_pool.get_with(...);

  `Default::default()` stays available only at sanctioned composition roots
  and test facades where building the singleton is the right thing to do.
severity: error
language: Rust
files:
  - crates/kithara/src/**/*.rs
  - crates/kithara-*/src/**/*.rs
ignores:
  - crates/kithara-bufpool/**
  - crates/kithara-devtools/**
  - crates/kithara-test-macros/**
  - crates/kithara-test-utils/**
  - crates/kithara-workspace-hack/**
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
  - crates/kithara-host/src/session/testing.rs
  - crates/kithara-play/src/session/testing.rs
rule:
  all:
    - any:
        - pattern: "BytePool::default()"
        - pattern: "SamplePool::default()"
        - pattern: "kithara_bufpool::BytePool::default()"
        - pattern: "kithara_bufpool::SamplePool::default()"
        - pattern: "let $NAME: BytePool = Default::default();"
        - pattern: "let mut $NAME: BytePool = Default::default();"
        - pattern: "let $NAME: SamplePool = Default::default();"
        - pattern: "let mut $NAME: SamplePool = Default::default();"
        - pattern: "let $NAME: kithara_bufpool::BytePool = Default::default();"
        - pattern: "let mut $NAME: kithara_bufpool::BytePool = Default::default();"
        - pattern: "let $NAME: kithara_bufpool::SamplePool = Default::default();"
        - pattern: "let mut $NAME: kithara_bufpool::SamplePool = Default::default();"
        - pattern: "$BUILDER.byte_pool(Default::default())"
        - pattern: "$BUILDER.sample_pool(Default::default())"
        - pattern: "$TYPE { $$$BEFORE, byte_pool: Default::default(), $$$AFTER }"
        - pattern: "$TYPE { $$$BEFORE, sample_pool: Default::default(), $$$AFTER }"
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b|^#\[test\]$|kithara::test'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: impl_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\(all\([^)]*\btest\b'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: function_item
            - follows:
                kind: attribute_item
                regex: 'wasm_bindgen\(start\)'
                stopBy:
                  not:
                    kind: attribute_item
          stopBy: end
