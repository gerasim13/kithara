id: idioms.match-self-conversion
message: |
  `fn name(self) -> Other { match self { ... } }` is a manual conversion.
  Replace with `impl From<Self> for Other` so callers can use `.into()` /
  the type system can chain.

      // ❌
      impl Codec {
          pub fn container(self) -> ContainerFormat {
              match self { Self::Mp3 => ContainerFormat::MpegAudio, /* ... */ }
          }
      }

      // ✅
      impl From<Codec> for ContainerFormat {
          fn from(c: Codec) -> Self {
              match c { Codec::Mp3 => Self::MpegAudio, /* ... */ }
          }
      }

  Suppress with `// ast-grep-ignore: idioms.match-self-conversion` only when
  the method legitimately can't be a `From` (e.g. result depends on more
  state than `self`).
severity: error
language: Rust
files:
  - crates/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  any:
    - pattern: |
        fn $NAME(self) -> $RET {
            match self { $$$ARMS }
        }
    - pattern: |
        fn $NAME(&self) -> $RET {
            match self { $$$ARMS }
        }
    - pattern: |
        pub fn $NAME(self) -> $RET {
            match self { $$$ARMS }
        }
    - pattern: |
        pub fn $NAME(&self) -> $RET {
            match self { $$$ARMS }
        }
    - pattern: |
        pub(crate) fn $NAME(self) -> $RET {
            match self { $$$ARMS }
        }
    - pattern: |
        pub(crate) fn $NAME(&self) -> $RET {
            match self { $$$ARMS }
        }
constraints:
  RET:
    not:
      # `Self` returns are already idiomatic; reference returns (`&T`,
      # `Option<&T>`, ...) provably cannot be a `From` impl, which consumes
      # `self` and returns an owned value, so they are accessors, not
      # conversions. Excluding both keeps the rule on owned `self -> Other`.
      #
      # A return carrying `()` — `StorageResult<()>` and friends — is the same
      # kind of proof: there is nothing to convert *to*, so the method is a
      # delegation that performs an action, not a conversion. Without this the
      # rule fires on every `match self` that forwards a command to the
      # variant's own backend, and the only way to pass it is the suppression
      # comment this repository does not allow.
      #
      # A bare `String` return is a `Display` impl, never `impl From<T> for
      # String`; the sibling rule `rust.prefer-from-not-to-into` already
      # excludes `^String$` on that ground and `rust.no-to-string-method` owns
      # the class.
      regex: 'Self|&|\(\)|^String$'
