id: rust.no-thin-sync-wrapper
message: Sync wrappers containing only one call plus logging are discouraged.
severity: warning
language: Rust
files:
  - crates/**/src/**/*.rs
ignores:
  - "**/tests/**"
  - "**/test_*.rs"
  - "**/*_test.rs"
  - "**/*_tests.rs"
  - "**/tests.rs"
rule:
  all:
    - kind: function_item
    - any:
        - regex: '(?s)^\s*fn\s+\w+\s*\([^)]*\)\s*(?:->\s*[^\{]+)?\{\s*(?:(?:trace|debug|info|warn|error)!\([^;]*\);\s*)+[A-Za-z0-9_:.]+\([^;]*\);?\s*(?:(?:trace|debug|info|warn|error)!\([^;]*\);\s*)*\}$'
        - regex: '(?s)^\s*fn\s+\w+\s*\([^)]*\)\s*(?:->\s*[^\{]+)?\{\s*(?:(?:trace|debug|info|warn|error)!\([^;]*\);\s*)*[A-Za-z0-9_:.]+\([^;]*\);?\s*(?:(?:trace|debug|info|warn|error)!\([^;]*\);\s*)+\}$'
    - not:
        inside:
          kind: trait_item
          stopBy: end
    - not:
        inside:
          all:
            - kind: mod_item
            - follows:
                kind: attribute_item
                regex: 'cfg\(test\)|cfg\((all|any)\([^)]*\btest\b'
                stopBy: end
          stopBy: end
    - not:
        has:
          kind: identifier
          field: name
          regex: '^(default|from|into|drop|fmt|fmt_\w+|clone|new|main)$'
