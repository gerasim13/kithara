# A suite is one production file and the unit tests that live in it.
#
# That shape is the whole point: pointed at the workspace, cargo-mutants spends
# days running three thousand tests per mutant and reports nothing, because a
# mutant that survives one file's own tests is drowned by the integration suite
# that never exercised it. Each suite here names the file, the package, and a
# nextest filterset over that file's `mod tests` - so a surviving mutant is a
# statement about the tests written next to the code it mutated.
#
# What earns a suite: dense decision logic - arithmetic, ordering, state
# transitions, thresholds - with its own unit tests. Plumbing and glue do not.

[[suite]]
name = "crossfader"
package = "kithara-play"
files = ["crates/kithara-play/src/engine/mix.rs"]
test_filters = ["test(/engine::mix::tests::/)"]
timeout_seconds = 120

# Throughput estimation: sample windows, minimum durations, chunk filtering and
# the cold-start seed are all thresholds, and a threshold is what mutation
# testing is best at.
[[suite]]
name = "throughput-estimator"
package = "kithara-abr"
files = ["crates/kithara-abr/src/estimator.rs"]
test_filters = ["test(/estimator::tests::/)"]
timeout_seconds = 120

# The seek epoch is the ordering contract the whole read path is judged by:
# which reads are stale, which completion belongs to which seek, when a flush
# has finished. An off-by-one here is a silent wrong answer, not a crash.
[[suite]]
name = "seek-state"
package = "kithara-stream"
files = ["crates/kithara-stream/src/seek_state.rs"]
test_filters = ["test(/seek_state::tests::/)"]
timeout_seconds = 180

# Transition identity decides which of two sources a late event belongs to.
[[suite]]
name = "transition"
package = "kithara-stream"
files = ["crates/kithara-stream/src/transition.rs"]
test_filters = ["test(/transition::tests::/)"]
timeout_seconds = 120

# Segment coordination decides which variant a switch lands on and when a
# request is still worth issuing. Thirty-six unit tests sit next to it, which
# is what makes a surviving mutant here a statement rather than a gap.
[[suite]]
name = "hls-coordinator"
package = "kithara-hls"
files = ["crates/kithara-hls/src/stream/coord.rs"]
test_filters = ["test(/stream::coord::tests::/)"]
timeout_seconds = 180

# The worker scheduler is ordering and nothing else: which command runs next,
# which deadline has passed, which wake is redundant.
[[suite]]
name = "worker-scheduler"
package = "kithara-play"
files = ["crates/kithara-play/src/worker/scheduler/core.rs"]
test_filters = ["test(/worker::scheduler::core::tests::/)"]
timeout_seconds = 180

# Durations, byte ranges and container boundaries: arithmetic whose off-by-one
# is a wrong answer the reader accepts rather than a panic it reports.
[[suite]]
name = "media-bounds"
package = "kithara-stream"
files = ["crates/kithara-stream/src/media.rs"]
test_filters = ["test(/media::tests::/)"]
timeout_seconds = 120

# Waveform windows: sample counts, bucket edges and the peak reduction. Every
# mutation-friendly shape at once, and the output is a picture nobody diffs.
# The module is behind `analysis-waveform`, which is not a default feature:
# without it the analyzer is not compiled, the filter selects nothing, and
# every mutant survives a suite that ran no test at all.
[[suite]]
name = "waveform-analyzer"
package = "kithara-analysis"
files = ["crates/kithara-analysis/src/waveform/analyzer.rs"]
features = ["analysis-waveform"]
test_filters = ["test(/waveform::analyzer::tests::/)"]
timeout_seconds = 180

# Layout arithmetic. A constraint solved one pixel wrong lays out, renders, and
# passes every test that only asks whether a frame was produced.
[[suite]]
name = "ui-size"
package = "kithara-ui"
files = ["crates/kithara-ui/src/size.rs"]
test_filters = ["test(/size::tests::/)"]
timeout_seconds = 180

# The queue's own state transitions: which track is current, what an advance
# does at the ends, and which of them is a no-op.
[[suite]]
name = "queue-track"
package = "kithara-queue"
files = ["crates/kithara-queue/src/track.rs"]
test_filters = ["test(/track::tests::/)"]
timeout_seconds = 120
