# The two sides name their default branch differently: GitLab follows the
# corporate contour with `develop`, GitHub keeps `main`. The bridge fast-
# forwards one onto the other, so each side has to be named for itself.
github_branch = "main"
github_repo = "zvuk/kithara"
github_token_file = "/path/to/github-token"
gitlab_branch = "develop"
gitlab_project_id = 1
gitlab_project_path = "group/kithara"
gitlab_token_file = "/path/to/gitlab-token"
gitlab_url = "https://gitlab.example.com"
gitlab_username = "kithara-sync"
state_dir = "/path/to/bridge-state"

# GitHub logins whose pull requests keep their own CI control paths during
# bridge verification. Other authors are verified with the default branch's
# controls restored; their pull requests stay on GitHub.
#
# Deliberately here and not in the repository: a list a pull request can edit is
# a list that adds its own author.
# trusted_authors = ["gerasim13"]
