.web-job:
  extends: .linux-job
  interruptible: false
  rules:
    - !reference [.platform-web, rules]
    - !reference [.rules-integration, rules]
  stage: web
  timeout: 60 minutes
  needs: []

web:chromium:
  extends:
    - .web-job
    - .measured
  script:
    - just ci run web-chromium

web:firefox:
  extends:
    - .web-job
    - .measured
  script:
    - just ci run web-firefox

web:size:
  extends: .web-job
  timeout: 30 minutes
  script:
    - just ci run web-size
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/wasm-slim-result.json
