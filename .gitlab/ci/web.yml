.web-job:
  extends:
    - .linux-job
    - .rules-integration
  stage: web
  timeout: 60 minutes
  needs: []

web:chromium:
  extends: .web-job
  script:
    - just ci run web-chromium

web:firefox:
  extends: .web-job
  script:
    - just ci run web-firefox

web:size:
  extends: .web-job
  timeout: 30 minutes
  script:
    - just ci run web-size
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/wasm-slim-result.json
      - crates/kithara-wasm/.wasm-slim/history.json
