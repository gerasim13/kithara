web:browsers:
  extends: .linux-job
  stage: web
  timeout: 60 minutes
  needs:
    - android:main
  script:
    - just ci run web
  rules:
    - if: $KITHARA_PIPELINE_KIND == "main"
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - target/wasm-slim-result.json
      - crates/kithara-wasm/.wasm-slim/history.json
