android:build:
  extends:
    - .android-job
    - .rules-integration
  stage: android
  timeout: 45 minutes
  needs: []
  script:
    - just ci run android-build

android:test:
  extends:
    - .android-job
    - .rules-integration
    - .measured
  stage: android
  timeout: 90 minutes
  needs:
    - android:build
  script:
    - just ci run android-test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit:
        - android/lib/build/outputs/androidTest-results/connected/**/*.xml
    paths:
      - android/lib/build/reports/androidTests/
      - android/lib/build/outputs/androidTest-results/
