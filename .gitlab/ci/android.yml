android:build:
  extends: .android-job
  interruptible: false
  rules:
    - !reference [.platform-android, rules]
    - !reference [.rules-integration, rules]
  stage: android
  timeout: 45 minutes
  needs: []
  script:
    - just ci run android-build
  # The suite consumes these rather than building both ABIs again while it
  # holds the emulator and the measured group.
  artifacts:
    expire_in: 1 day
    paths:
      - android/lib/build/generated/jniLibs
      - android/lib/build/generated/uniffi/kotlin

android:test:
  extends:
    - .android-job
    - .judged
    - .measured
  interruptible: false
  rules:
    - !reference [.platform-android, rules]
    - !reference [.rules-integration, rules]
  stage: android
  timeout: 90 minutes
  needs:
    - job: android:build
      artifacts: true
  script:
    - just ci run android-test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit:
        - android/lib/build/outputs/androidTest-results/connected/**/*.xml
    paths:
      - android/lib/build/reports/androidTests/
      - android/lib/build/outputs/androidTest-results/
      - target/junit/
