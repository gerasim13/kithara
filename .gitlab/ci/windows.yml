windows:nightly:
  extends: .windows-job
  stage: windows
  timeout: 120 minutes
  needs:
    - web:browsers
  script:
    - cargo run --locked -p xtask -- ci run windows
  rules:
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/nextest/ci/junit.xml
    paths:
      - target/nextest/ci/junit.xml
