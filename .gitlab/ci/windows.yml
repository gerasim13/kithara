.windows-lane:
  extends:
    - .windows-job
    - .rules-nightly
  stage: windows
  timeout: 120 minutes
  needs: []
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/nextest/ci/junit.xml
    paths:
      - target/nextest/ci/junit.xml

windows:arm64:
  extends: .windows-lane
  script:
    - cargo run --locked -p xtask -- ci run windows-arm64

windows:x64:
  extends: .windows-lane
  script:
    - cargo run --locked -p xtask -- ci run windows-x64
