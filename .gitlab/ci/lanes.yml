.lane-job:
  extends: .linux-job
  interruptible: false
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-weekly, rules]
  stage: lanes
  timeout: 180 minutes
  needs: []

lanes:doc:
  extends: .lane-job
  script:
    - just ci run linux-doc

lanes:loom:
  extends: .lane-job
  script:
    - just ci run linux-loom

# Live HLS packaging, hidden behind the `broadcast` feature and therefore absent
# from every other job in this pipeline. It reports rather than judges: the
# feature ships to nobody yet, so a red packager is worth seeing on the board
# and is not worth failing a pipeline that says nothing else about it. It stays
# out of `verdict`'s `needs` for the same reason — the merge decision is about
# what the workspace lanes ran.
#
# Unlike every lane around it, it takes the weekly kind without
# `.platform-linux`. That gate asks whether the run opted into the Linux
# platform, and no schedule sets `KITHARA_PLATFORMS` — which is why none of the
# jobs beside it has ever run. The packager is not a platform, so gating it on
# one would put that same never-runs stamp on the only place its tests exist.
# Linux serves it because it needs no output device and no simulator, not
# because a run asked for Linux.
lanes:broadcast:
  extends: .lane-job
  allow_failure: true
  rules:
    - !reference [.rules-weekly, rules]
  script:
    - just ci run linux-broadcast

lanes:integration-regressions:
  extends: .lane-job
  script:
    - just ci run linux-integration-regressions

# Linux CI runs in containers with no output device, so `apple:e2e` serves the
# hardware-dependent e2e lanes.

lanes:selenium-firefox:
  extends: .lane-job
  script:
    - just ci run linux-selenium-firefox
