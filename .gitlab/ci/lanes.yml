.lane-job:
  extends: .linux-job
  interruptible: false
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-weekly, rules]
  stage: lanes
  timeout: 180 minutes
  needs: []

lanes:doc:
  extends: .lane-job
  script:
    - just ci run linux-doc

lanes:loom:
  extends: .lane-job
  script:
    - just ci run linux-loom

lanes:integration-regressions:
  extends: .lane-job
  script:
    - just ci run linux-integration-regressions

# Linux CI runs in containers with no output device, so `apple:e2e` serves the
# hardware-dependent e2e lanes.

lanes:selenium-firefox:
  extends: .lane-job
  script:
    - just ci run linux-selenium-firefox
