# Consumers receive the selected repository digest before their containers
# start; concurrent pipelines never communicate through a floating image tag.
linux:image:
  extends: .macos-job
  stage: linux
  timeout: 90 minutes
  needs: []
  rules:
    - if: $KITHARA_PIPELINE_KIND == "provision"
      when: never
    - when: on_success
  script:
    - just ci host mac build-linux-image docker/ci.Dockerfile
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      dotenv: .ci-artifacts/linux-image.env

# The same roll-out on the Mac mini, opted into by starting a pipeline on the
# default branch with `KITHARA_PROVISION` set to `1`, from "Run pipeline" or the
# API. That run is the `provision` kind and carries this job alone. It
# reinstalls the services from this commit, rewrites the runner configuration,
# makes sure the pinned Linux image is there and reloads the agents.
#
# The default branch only. Provisioning writes to the machine that serves every
# lane, and a merge-request or quarantine ref carries code no one has reviewed
# yet; `linux:image` above is what those refs get, and it only ever builds an
# image from pins the ref already ran under.
host:provision:
  extends: .macos-job
  stage: linux
  timeout: 180 minutes
  needs: []
  rules:
    - if: $KITHARA_PIPELINE_KIND == "provision"
  script:
    - just ci host provision
