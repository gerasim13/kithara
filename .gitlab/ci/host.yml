# Repairs the host needs on itself, reachable from the pipeline rather than
# only over ssh.

# The Linux runner runs `kithara-ci:linux-latest`, and this job is what points
# that tag at the image the commit pins. Every Linux job waits for it.
#
# Before, the runner named the pinned tag itself, so a pin bump broke every
# Linux job until someone logged in and rebuilt the image by hand; a colima
# restart, which recreates the VM, did the same. Now the job builds the pinned
# image only when the host lacks it and otherwise just moves the tag, which
# takes seconds, so it runs on every pipeline and the lane repairs itself.
#
# `pins` come from the checkout the job already has, so the image is tagged
# with whatever the commit pins.
#
# It takes the macOS shell runner, not the release one: the release runner
# serves protected refs only, so a quarantine or merge-request pipeline — the
# ones that most need the image — left this job pending until it was dropped.
# The macOS runner is the same `kithara-ci` account on the same host and
# already runs the change's code, so it grants the change nothing new.
linux:image:
  extends: .macos-job
  stage: linux
  timeout: 90 minutes
  needs: []
  script:
    - just ci host mac build-linux-image docker/ci.Dockerfile
    - just ci host mac smoke-linux

# The same roll-out on the Mac mini, and the same opt-in: set `KITHARA_PROVISION`
# to `1` when starting the pipeline. It reinstalls the services from this
# commit, rewrites the runner configuration, makes sure the pinned Linux image
# is there and reloads the agents.
#
# Protected kinds only. Provisioning writes to the machine that serves every
# lane, and a merge-request or quarantine ref carries code no one has reviewed
# yet; `linux:image` above is what those refs get, and it only ever builds an
# image from pins the ref already ran under.
host:provision:
  extends: .macos-job
  stage: linux
  timeout: 180 minutes
  needs: []
  rules:
    - if: $KITHARA_PROVISION != "1"
      when: never
    - if: $KITHARA_PIPELINE_KIND == "main"
    - if: $KITHARA_PIPELINE_KIND == "nightly"
    - if: $KITHARA_PIPELINE_KIND == "release"
  script:
    - just ci host provision
