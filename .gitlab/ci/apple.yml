apple:required:
  extends: .macos-job
  stage: apple
  timeout: 60 minutes
  interruptible: true
  script:
    - just ci run apple
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
    - if: $KITHARA_PIPELINE_KIND == "main"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "nightly"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "release"
      interruptible: false
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/nextest/ci/junit.xml
    paths:
      - target/nextest/ci/junit.xml
      - target/quality-report.md
      - target/trait-mock-audit.md
      - target/rstest-audit.md
