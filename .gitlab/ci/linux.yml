linux:portability:
  extends: .linux-job
  stage: linux
  timeout: 60 minutes
  needs:
    - apple:required
  script:
    - just ci run linux
  rules:
    - if: $KITHARA_PIPELINE_KIND == "merge-request"
    - if: $KITHARA_PIPELINE_KIND == "quarantine"
    - if: $KITHARA_PIPELINE_KIND == "main"
      interruptible: false
    - if: $KITHARA_PIPELINE_KIND == "nightly"
      interruptible: false
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
      junit: target/nextest/ci/junit.xml
    paths:
      - coverage/
      - target/nextest/ci/junit.xml
