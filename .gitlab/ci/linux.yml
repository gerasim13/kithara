.linux-lane:
  extends: .linux-job
  interruptible: true
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-verify, rules]
  stage: linux
  timeout: 60 minutes
  needs: []

linux:secrets:
  extends: .linux-lane
  timeout: 15 minutes
  script:
    - just ci run linux-secrets
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json

linux:check:
  extends: .linux-lane
  script:
    - just ci run linux-check

linux:test:
  extends:
    - .linux-job
    - .judged
    - .measured
  interruptible: false
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-integration, rules]
  stage: linux
  timeout: 60 minutes
  needs: []
  script:
    - just ci run linux-test
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: target/nextest/ci/junit.xml
    paths:
      - target/junit/

linux:coverage:
  extends:
    - .linux-job
    - .measured
  interruptible: false
  rules:
    - !reference [.platform-linux, rules]
    - !reference [.rules-nightly, rules]
  stage: linux
  timeout: 90 minutes
  needs: []
  script:
    - just ci run linux-coverage
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
    paths:
      - coverage/
