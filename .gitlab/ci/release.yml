.release-build:
  extends:
    - .macos-job
    - .rules-release
  stage: release-build
  timeout: 180 minutes
  needs:
    - apple:test

release:xcframework:
  extends: .release-build
  script:
    - just ci run release-xcframework --package release
  artifacts:
    expire_in: never
    paths:
      - KitharaFFIInternal.xcframework.zip
      - KitharaFFIInternal.xcframework.zip.sha256
      - Kithara.xcframework.zip
      - Kithara.xcframework.zip.sha256

release:docs:
  extends: .release-build
  timeout: 90 minutes
  script:
    - just ci run release-docs
  artifacts:
    expire_in: never
    paths:
      - Kithara-docs.zip
      - Kithara-docs.zip.sha256

release:wasm:
  extends: .release-build
  timeout: 90 minutes
  script:
    - just ci run release-wasm
  artifacts:
    expire_in: never
    paths:
      - kithara-wasm-pages.zip
      - kithara-wasm-pages.zip.sha256

release:android:
  extends:
    - .android-job
    - .rules-release
  stage: release-build
  timeout: 180 minutes
  needs:
    - apple:test
  script:
    - just ci run release-android
  artifacts:
    expire_in: never
    paths:
      - kithara.aar
      - kithara.aar.sha256
      - rust-tls.aar
      - rust-tls.aar.sha256

release:publish:
  extends:
    - .release-job
    - .rules-release
  stage: release-publish
  timeout: 90 minutes
  needs:
    - job: release:xcframework
      artifacts: true
    - job: release:docs
      artifacts: true
    - job: release:wasm
      artifacts: true
    - job: release:android
      artifacts: true
  environment:
    name: release
  script:
    - just ci run release-publish
  rules:
    # A release is a decision, so someone presses the button. A nightly is not:
    # it replaces one rolling tag with what the branch builds into today, and
    # waiting for a person would leave that tag stale exactly when it matters.
    - if: $KITHARA_PIPELINE_KIND == "release"
      when: manual
    - if: $KITHARA_PIPELINE_KIND == "nightly"
  allow_failure: false
