name: kithara-ci-cache

x-cache-image: &cache-image
  image: kithara-ci-cache:local
  pull_policy: never

services:
  credentials:
    <<: *cache-image
    build:
      context: ..
      dockerfile: docker/ci-cache.Dockerfile
      args:
        CACHE_SERVER_IMAGE: ${KITHARA_CACHE_SERVER_IMAGE:?use just ci cache to load ci-pins.toml}
        CACHE_CLIENT_IMAGE: ${KITHARA_CACHE_CLIENT_IMAGE:?use just ci cache to load ci-pins.toml}
        RUST_VERSION: ${KITHARA_RUST_VERSION:?use just ci cache to load ci-pins.toml}
        RUST_BASE_DIGEST: ${KITHARA_RUST_DIGEST:?use just ci cache to load ci-pins.toml}
    entrypoint: ["xtask", "ci", "cache", "credentials"]
    network_mode: none
    volumes:
      - ${CACHE_CONFIG_VOLUME:?set the host directory for the cache credentials}:/config
    restart: "no"

  cache:
    <<: *cache-image
    container_name: kithara-ci-cache
    environment:
      RUSTFS_ACCESS_KEY_FILE: /config/admin-user
      RUSTFS_SECRET_KEY_FILE: /config/admin-password
      # Every request reaches the evictor, which learns from it what each
      # build still reads. The store refuses to send anywhere it was not
      # told to reach.
      RUSTFS_AUDIT_ENABLE: "true"
      RUSTFS_AUDIT_WEBHOOK_ENABLE_RECENCY: "on"
      RUSTFS_AUDIT_WEBHOOK_ENDPOINT_RECENCY: http://kithara-ci-cache-evict:9180/
      RUSTFS_AUDIT_WEBHOOK_QUEUE_DIR_RECENCY: /audit
      RUSTFS_AUDIT_WEBHOOK_QUEUE_LIMIT_RECENCY: "20000"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://kithara-ci-cache-evict:9180
    # What the evictor has not taken yet waits in memory: a request it misses
    # only ages an entry, and the queue must not take the store's disk.
    tmpfs:
      - /audit:size=128m
    depends_on:
      credentials:
        condition: service_completed_successfully
    # Directories on the host's disk, never named volumes: the store has to
    # outlive every rebuild of the image and container serving it.
    volumes:
      - ${CACHE_CONFIG_VOLUME:?set the host directory for the cache credentials}:/config:ro
      - ${CACHE_DATA_VOLUME:?set the host directory for the cached objects}:/data
    ports:
      - "127.0.0.1:${CACHE_PORT:-19000}:9000"
    networks: [ci, audit]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  initialize:
    <<: *cache-image
    entrypoint: ["xtask", "ci", "cache", "initialize"]
    # The host's environment whole: a scope sized apart names its quota as
    # CACHE_BUCKET_QUOTA_<SCOPE>, a name this file cannot list.
    env_file: ${CACHE_ENV_FILE:?use just ci cache}
    depends_on:
      cache:
        condition: service_healthy
    volumes:
      - ${CACHE_CONFIG_VOLUME:?set the host directory for the cache credentials}:/config:ro
      - ${CACHE_CLIENTS_VOLUME:?set the host directory for the client credentials}:/clients
    networks: [ci]
    restart: "no"

  evict:
    <<: *cache-image
    container_name: kithara-ci-cache-evict
    entrypoint: ["xtask", "ci", "cache", "evict"]
    env_file: ${CACHE_ENV_FILE:?use just ci cache}
    depends_on:
      initialize:
        condition: service_completed_successfully
    volumes:
      - ${CACHE_CONFIG_VOLUME:?set the host directory for the cache credentials}:/config:ro
    networks: [audit]
    init: true
    restart: unless-stopped

networks:
  ci:
    external: true
    name: ${CACHE_NETWORK:?set existing CI network}
  # The evictor takes the audit log on trust, so only the store reaches it:
  # every job container shares the network above.
  audit:
    internal: true
