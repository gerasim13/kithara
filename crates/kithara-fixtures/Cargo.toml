[package]
name = "kithara-fixtures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-time generated audio test assets: content-addressed store and generated accessors."
publish = false

[dependencies]
hex = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[build-dependencies]
kithara-test-macros = { workspace = true }

hex = { workspace = true }
inventory = { workspace = true }
num-traits = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The backend features are what lets `cargo test -p kithara-fixtures` stand on
# its own: kithara-net, reached through test-utils, refuses to build without one.
kithara-test-utils = { workspace = true, features = ["client-reqwest", "probe", "tls-rustls"] }

tempfile = { workspace = true }

[lints]
workspace = true
