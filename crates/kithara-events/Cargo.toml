[package]
name = "kithara-events"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hierarchical event bus for the audio pipeline."
keywords = ["events", "audio", "observer", "pubsub", "player"]
categories = ["asynchronous"]

[features]
default = ["hls", "player", "queue", "drm"]
hls = []
drm = []
player = []
queue = []

[dependencies]
kithara-derive = { workspace = true }
kithara-platform = { workspace = true }
kithara-signal = { workspace = true, optional = true }

crossbeam-queue = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
portable-atomic = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-events = { path = ".", default-features = false }
kithara-test-utils = { path = "../kithara-test-utils", features = ["mock", "probe", "hang"] }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
