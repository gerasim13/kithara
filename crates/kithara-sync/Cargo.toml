[package]
name = "kithara-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Recursive synchronization-group ownership and control-plane protocol for Kithara."
keywords = ["audio", "beatgrid", "dj", "synchronization", "topology"]
categories = ["multimedia::audio"]

[features]
default = []
usdt = ["kithara-warp/usdt"]
perf = ["kithara-warp/perf"]

[dependencies]
kithara-platform = { workspace = true }
kithara-signal = { workspace = true }
kithara-warp = { workspace = true, default-features = false }

bon = { workspace = true }
delegate = { workspace = true }
derive_more = { workspace = true }
fieldwork = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
kithara-workspace-hack = { version = "0.0.1-alpha4", path = "../kithara-workspace-hack" }

[dev-dependencies]
kithara-test-utils = { workspace = true, features = ["usdt", "client-reqwest", "tls-rustls"] }

[lints]
workspace = true
