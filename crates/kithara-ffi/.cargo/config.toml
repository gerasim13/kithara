# Workaround: nightly removed panic_immediate_abort as a build-std-feature.
# It is now a real panic strategy: -Cpanic=immediate-abort (wasm gets it from
# the target rustflags below; apple release gets it from xtask RUSTFLAGS).
# Pre-setting build-std-features here prevents wasm-slim from injecting
# the removed feature (it skips if the key already exists).
# optimize_for_size picks the smaller std algorithm variants on the size
# lanes (apple/wasm slices); empty otherwise means "no default std features",
# which already drops std's backtrace machinery.

[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]
build-std-features = ["optimize_for_size"]

[target.wasm32-unknown-unknown]
rustflags = ["-Zunstable-options", "-Cpanic=immediate-abort"]
